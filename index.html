<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>💖 dia das pepeta</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial;

      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    h1 {
      color: white;
      text-align: center;
      font-size: 32px;
      text-shadow: 0 0 10px rgba(0,0,0,0.4);
      animation: flutuar 2s infinite ease-in-out;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .botoes {
      margin-top: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sim {
      background: #4CAF50;
      color: white;
    }

    #sim:hover {
      transform: scale(1.1);
    }

    #nao {
      background: #ff4d4d;
      color: white;
      position: absolute;
    }

    .coracoes {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .coracao {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: cair 5s linear infinite;
    }

    @keyframes cair {
      from { transform: translateY(-50px); opacity: 1; }
      to { transform: translateY(110vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <h1>💖 bom diazinho momo, hoje tem pepeta? 💖</h1>

  <div class="botoes">
    <button id="sim" onclick="clicouSim()">Sim 😍</button>

    <button id="nao"
      onmouseenter="fugir()"
      ontouchstart="fugir()"
      onclick="fugir()">
      Não 😢
    </button>
  </div>

  <div class="coracoes" id="coracoes"></div>

  <script>
    function clicouSim() {
      window.location.href = "https://wa.me/5598981584080?text=sim momo hoje tem pepetaa❤️";
    }

    function fugir() {
      let btn = document.getElementById("nao");

      let largura = window.innerWidth - btn.offsetWidth;
      let altura = window.innerHeight - btn.offsetHeight;

      let x = Math.random() * largura;
      let y = Math.random() * altura;

      btn.style.position = "absolute";
      btn.style.left = x + "px";
      btn.style.top = y + "px";

      btn.innerText = "não 😭";

      navigator.vibrate?.(80);
    }

    // corações caindo
    function criarCoracao() {
      const coracao = document.createElement("div");
      coracao.classList.add("coracao");
      coracao.innerText = "❤️";

      coracao.style.left = Math.random() * 100 + "vw";
      coracao.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.getElementById("coracoes").appendChild(coracao);

      setTimeout(() => {
        coracao.remove();
      }, 6000);
    }

    setInterval(criarCoracao, 250);
  </script>

</body>
</html>
