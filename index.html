<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>tem pepeta hoje?</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      position: relative;
    }

    #nao {
      position: absolute;
    }
  </style>
</head>
<body>

  <h1>bom diazinho momo❤️tem pepeta hoje?</h1>

  <button onclick="clicouSim()">Sim</button>
  <button id="nao" onmouseover="fugir()">Não</button>

  <script>
    function clicouSim() {
      window.location.href = "https://wa.me/5598981584080?text=Sim momo tem pepeta hoje❤️";
    }

    function fugir() {
      let btn = document.getElementById("nao");

      let x = Math.random() * (window.innerWidth - btn.offsetWidth);
      let y = Math.random() * (window.innerHeight - btn.offsetHeight);

      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }
  </script>

</body>
</html>
